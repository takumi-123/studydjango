<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カフェ新規登録</title>
  </head>
  <body>
    <h1>新規カフェ登録</h1>

    <!--登録フォーム-->
    <form method="post">
      {% csrf_token %}
      <!--Djangoのおきまりのセキュリティ-->
      {{ form.as_p }}
      <!-- views.pyから渡されたフォームを自動で表示-->

      <button type="submit">登録する</button>
    </form>

    <p><a href="{% url 'cafe_list' %}">カフェ一覧に戻る</a></p>
  </body>
</html>
