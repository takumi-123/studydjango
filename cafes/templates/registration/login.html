<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログイン - マイカフェログイン</title>
  </head>
  <body>
    <h1>ログイン</h1>
    <!--エラーの場合-->
    {% if form.errors %}
    <p style="color: red">ユーザー名またはパスワードが間違っています</p>
    {% endif %}

    <!--ログインフォーム-->
    <form method="post">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">ログイン</button>
    </form>
  </body>
</html>
