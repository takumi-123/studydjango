<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ログイン</title>
  </head>
  <body>
    <h1>ログイン</h1>

    <!-- エラーメッセージがある場合に表示 -->
    {% if form.errors %}
    <p style="color: red">ユーザー名またはパスワードが間違っています。</p>
    {% endif %}

    <form method="post">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">ログイン</button>
    </form>

    <p>
      <a href="{% url 'accounts:signup' %}"
        >アカウントをお持ちでない方はこちら（新規登録）</a
      >
    </p>
  </body>
</html>
