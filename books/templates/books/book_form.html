{% load static %}
<!-- ←これが必要！ -->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>本を登録</title>
    <!-- 自作のCSSを読み込む例 -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="container">
      <h1>新しい本を登録する</h1>

      <form method="post">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit" class="btn">登録する</button>
      </form>

      <br />
      <a href="{% url 'book_list' %}">← 一覧に戻る</a>
    </div>
  </body>
</html>
